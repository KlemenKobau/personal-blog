baseURL = "https://kkobau.com/"
languageCode = "en-gb"
title = "Klemen Kobau - Developer Blog"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true

[params]
  env = "production"
  author = "Klemen Kobau"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  ShowToc = true
  ShowRssButtonInSectionTermList = true
  DateFormat = "2 January, 2006"

[minify]
  disableXML = true
  minifyOutput = true

[params.homeInfoParams]
  Title = "Klemen Kobau"
  Content = "Developer blog showcasing programming projects"

[[params.socialIcons]]
  name = "cv"
  url = "https://klemenkobau.gitlab.io/cv/klemen-kobau.pdf"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/KlemenKobau"

[[params.socialIcons]]
  name = "gitlab"
  url = "https://gitlab.com/KlemenKobau"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/klemen-kobau/"

[[params.socialIcons]]
  name = "email"
  url = "mailto:klemen.kobau@gmail.com"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 20

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 30

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[services.googleAnalytics]
  ID = "G-DYFCBKS3VB"

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputFormats.llms-full]
mediaType = "text/plain"
baseName = "llms-full"
isPlainText = true
notAlternative = true

[outputs]
home = [ "HTML", "RSS", "JSON", "llms", "llms-full" ]
