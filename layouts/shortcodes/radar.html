{{- $sheet := .Get "sheet" -}}
{{- $size := .Get "size" | default "800" -}}
<div class="radar-embed" data-sheet="{{ $sheet }}" data-size="{{ $size }}">
  <div class="radar-nav" hidden>
    <a href="#" class="radar-back">← Back to overview</a>
    <h2 class="radar-quadrant-heading"></h2>
  </div>
  <svg id="radar"></svg>
  <div class="radar-tooltip" hidden></div>
  <div class="radar-list"></div>
</div>
<style>
  .radar-embed {
    position: relative;
    width: min(1400px, 96vw);
    margin-left: calc(50% - min(700px, 48vw));
  }
  .radar-embed svg#radar {
    display: block;
    width: min(100%, 800px);
    height: auto;
    margin: 0 auto;
  }
  .radar-nav {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .radar-nav[hidden] {
    display: none;
  }
  .radar-back {
    color: var(--content);
    font-weight: 600;
    text-decoration: none;
  }
  .radar-back:hover {
    text-decoration: underline;
  }
  .radar-quadrant-heading {
    margin: 0;
    font-size: 1.1rem;
  }
  .radar-list {
    max-width: 720px;
    margin: 1.5rem auto 0;
  }
  .radar-ring-group h3 {
    margin: 1.25rem 0 0.5rem;
    font-size: 0.9rem;
  }
  .radar-item {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--entry);
    color: var(--content);
    margin-bottom: 0.5rem;
    padding: 0.5rem 0.75rem;
  }
  .radar-item summary {
    cursor: pointer;
    font-weight: 600;
  }
  .radar-item[open] summary {
    margin-bottom: 0.5rem;
  }
  .radar-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--entry);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.15rem 0.5rem;
    font-size: 0.8rem;
    color: var(--content);
    white-space: nowrap;
    transform: translate(-50%, -130%);
    z-index: 10;
  }
  .radar-tooltip[hidden] {
    display: none;
  }
</style>
<script src="{{ "js/vendor/d3.min.js" | relURL }}"></script>
<script src="{{ "js/radar-mapping.js" | relURL }}"></script>
<script src="{{ "js/radar-loader.js" | relURL }}"></script>
