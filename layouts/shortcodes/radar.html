{{- $sheet := .Get "sheet" -}}
{{- $size := .Get "size" | default "800" -}}
<div class="radar-embed" data-sheet="{{ $sheet }}" data-size="{{ $size }}">
  <svg id="radar"></svg>
  <div class="radar-legend"></div>
  <div class="radar-detail" hidden></div>
</div>
<style>
  .radar-embed {
    width: min(1400px, 96vw);
    margin-left: calc(50% - min(700px, 48vw));
  }
  .radar-embed svg#radar {
    display: block;
    width: min(100%, 800px);
    height: auto;
    margin: 0 auto;
  }
  .radar-legend {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
  }
  .radar-legend-quadrant h3 {
    margin-bottom: 0.5rem;
  }
  .radar-legend-quadrant h4 {
    margin: 0.75rem 0 0.25rem;
    font-size: 0.9rem;
  }
  .radar-legend-quadrant ul {
    margin: 0;
    padding-left: 1.1rem;
  }
  .radar-legend-quadrant a {
    color: var(--content);
  }
  .radar-detail {
    max-width: 720px;
    margin: 1.5rem auto 0;
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--entry);
    color: var(--content);
  }
  .radar-detail[hidden] {
    display: none;
  }
</style>
<script src="{{ "js/vendor/d3.min.js" | relURL }}"></script>
<script src="{{ "js/radar-mapping.js" | relURL }}"></script>
<script src="{{ "js/radar-loader.js" | relURL }}"></script>
