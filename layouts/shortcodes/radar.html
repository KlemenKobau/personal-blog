{{- $sheet := .Get "sheet" -}}
{{- $width := .Get "width" | default "1450" -}}
{{- $height := .Get "height" | default "1200" -}}
<div class="radar-embed" data-sheet="{{ $sheet }}" data-width="{{ $width }}" data-height="{{ $height }}">
  <svg id="radar"></svg>
  <div class="radar-detail" hidden></div>
</div>
<style>
  .radar-embed {
    width: min(1400px, 96vw);
    margin-left: calc(50% - min(700px, 48vw));
  }
  .radar-embed svg#radar {
    display: block;
    width: 100%;
    height: auto;
  }
  /* radar.js leaves the title, the footer movement key, the quadrant legend
     headings and every legend entry label with no fill at all, so they fall
     back to the SVG default (black) and vanish on the dark theme. Give only
     those a themed color.

     The :not([fill]) guard matters: CSS declarations beat SVG presentation
     attributes, so a bare `text { fill: ... }` would also override the
     fill="white" ATTRIBUTE that highlightLegendItem() sets on hover and kill
     the highlight. Excluding elements that carry a fill attribute lets the
     attribute win again the moment it is added (and removing it on mouseout
     brings this rule back). Everything radar.js colors via .style(...) —
     ring labels, blip numbers, bubble text, the date — has an inline style,
     which outranks this rule regardless. */
  .radar-embed svg#radar text:not([fill]) {
    fill: var(--content);
  }
  .radar-detail {
    max-width: 720px;
    margin: 1.5rem auto 0;
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--entry);
    color: var(--content);
  }
  .radar-detail[hidden] {
    display: none;
  }
</style>
<script src="{{ "js/vendor/d3.min.js" | relURL }}"></script>
<script src="{{ "js/vendor/radar.js" | relURL }}"></script>
<script src="{{ "js/radar-mapping.js" | relURL }}"></script>
<script src="{{ "js/radar-loader.js" | relURL }}"></script>
